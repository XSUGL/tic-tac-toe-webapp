<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ARCADE X</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="noise"></div>

    <!-- HUB -->
    <div class="hub" id="hub">
        <div class="hub-header">
            <div class="logo">ARCADE<span>X</span></div>
            <button class="icon-btn" id="settingsBtn">⚙</button>
        </div>
        <p class="hub-sub">SELECT GAME</p>
        <div class="game-cards">
            <div class="game-card" data-game="ttt">
                <div class="card-shine"></div>
                <div class="card-icon ttt-icon">✕ ○</div>
                <div class="card-title">TIC-TAC-TOE</div>
                <div class="card-desc">Classic 3×3</div>
            </div>
            <div class="game-card" data-game="ttt5">
                <div class="card-shine"></div>
                <div class="card-icon ttt5-icon">5×5</div>
                <div class="card-title">TTT ULTRA</div>
                <div class="card-desc">5 in a row wins</div>
                <div class="badge">NEW</div>
            </div>
            <div class="game-card" data-game="c4">
                <div class="card-shine"></div>
                <div class="card-icon c4-icon">⬤ ⬤ ⬤ ⬤</div>
                <div class="card-title">CONNECT 4</div>
                <div class="card-desc">Drop & connect</div>
                <div class="badge">NEW</div>
            </div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div class="game-screen hidden" id="gameScreen">
        <div class="topbar">
            <button class="back-btn" id="backBtn">← MENU</button>
            <div class="game-name" id="gameName">TIC-TAC-TOE</div>
            <button class="icon-btn" id="settingsBtnGame">⚙</button>
        </div>

        <!-- Setup -->
        <div class="setup" id="setup">
            <div class="pill-row">
                <button class="pill active" data-mode="bot" id="botPill">🤖 VS BOT</button>
                <button class="pill" data-mode="player" id="p2Pill">👥 2 PLAYERS</button>
            </div>
            <div class="pill-row" id="diffRow">
                <button class="pill active" data-diff="easy">EASY</button>
                <button class="pill" data-diff="medium">MEDIUM</button>
                <button class="pill" data-diff="hard">HARD</button>
            </div>
            <button class="start-btn pulse" id="startBtn">▶ START GAME</button>
        </div>

        <!-- Turn -->
        <div class="turn-bar hidden" id="turnBar">
            <div class="turn-player" id="turnPlayer">
                <span class="turn-symbol" id="turnSymbol">✕</span>
                <span id="turnLabel">YOUR TURN</span>
            </div>
        </div>

        <!-- Score -->
        <div class="scoreboard">
            <div class="score-col">
                <div class="score-label" id="sName1">PLAYER</div>
                <div class="score-val" id="sVal1">0</div>
            </div>
            <div class="score-div"></div>
            <div class="score-col mid">
                <div class="score-label">DRAW</div>
                <div class="score-val" id="sValD">0</div>
            </div>
            <div class="score-div"></div>
            <div class="score-col">
                <div class="score-label" id="sName2">BOT</div>
                <div class="score-val" id="sVal2">0</div>
            </div>
        </div>

        <!-- Boards -->
        <div class="board-area">
            <!-- TTT 3x3 -->
            <div class="ttt-board hidden" id="tttBoard"></div>
            <!-- TTT 5x5 -->
            <div class="ttt5-board hidden" id="ttt5Board"></div>
            <!-- Connect 4 -->
            <div class="c4-wrap hidden" id="c4Wrap">
                <div class="c4-arrows" id="c4Arrows"></div>
                <div class="c4-grid" id="c4Grid"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="ctrl-row hidden" id="ctrlRow">
            <button class="ctrl-btn accent" id="restartBtn">↺ RESTART</button>
            <button class="ctrl-btn" id="newGameBtn">⊞ NEW GAME</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="overlay hidden" id="settingsModal">
        <div class="modal-box">
            <div class="modal-head">
                <span>SETTINGS</span>
                <button class="close-x" id="closeSettings">✕</button>
            </div>
            <label class="field-label">LANGUAGE</label>
            <select class="field-select" id="langSelect">
                <option value="en">English</option>
                <option value="ru">Русский</option>
                <option value="it">Italiano</option>
            </select>
            <label class="field-label">WHO GOES FIRST (vs Bot)</label>
            <select class="field-select" id="firstSelect">
                <option value="player">Player always first</option>
                <option value="bot">Bot always first</option>
                <option value="alternating">Alternating</option>
            </select>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="overlay hidden" id="resultModal">
        <div class="modal-box result-box">
            <div class="result-emoji" id="resultEmoji">🎉</div>
            <div class="result-title" id="resultTitle">YOU WIN!</div>
            <button class="start-btn" id="playAgainBtn" style="margin-top:24px">PLAY AGAIN</button>
            <button class="ctrl-btn" id="menuFromResult">← MENU</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
