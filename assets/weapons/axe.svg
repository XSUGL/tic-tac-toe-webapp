<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c8d8"/>
      <stop offset="40%" style="stop-color:#8898a8"/>
      <stop offset="100%" style="stop-color:#506070"/>
    </linearGradient>
  </defs>
  <!-- Handle -->
  <rect x="44" y="46" width="12" height="52" rx="5" fill="#7a4a20" stroke="#5a3010" stroke-width="1"/>
  <line x1="46" y1="50" x2="46" y2="94" stroke="#a06030" stroke-width="2" opacity="0.4"/>
  <!-- Handle grip wrap -->
  <rect x="44" y="60" width="12" height="3" rx="1.5" fill="#5a3010" opacity="0.6"/>
  <rect x="44" y="70" width="12" height="3" rx="1.5" fill="#5a3010" opacity="0.6"/>
  <rect x="44" y="80" width="12" height="3" rx="1.5" fill="#5a3010" opacity="0.6"/>
  <!-- Axe head — large crescent blade -->
  <path d="M50,46 L38,10 Q20,4 16,18 Q12,32 22,42 Q32,52 50,46 Z" fill="url(#ab)" stroke="#607080" stroke-width="1.5"/>
  <!-- Blade edge (sharp curved edge) -->
  <path d="M38,10 Q20,4 16,18 Q12,32 22,42" fill="none" stroke="#d0d8e8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Back of head -->
  <path d="M50,46 L62,18 Q56,10 50,12 L38,10 Z" fill="#8898a8" stroke="#607080" stroke-width="1"/>
  <!-- Blade fuller (groove) -->
  <path d="M46,42 Q30,30 24,20" fill="none" stroke="#a0b0c0" stroke-width="1.5" opacity="0.6"/>
  <!-- Beard (lower extension) -->
  <path d="M22,42 Q28,54 50,46" fill="url(#ab)" stroke="#607080" stroke-width="1"/>
  <!-- Eye hole -->
  <ellipse cx="42" cy="28" rx="5" ry="7" fill="#1c2830" stroke="#607080" stroke-width="1"/>
  <!-- Shine -->
  <path d="M20,20 Q22,16 28,14" fill="none" stroke="white" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <!-- Handle butt -->
  <rect x="43" y="92" width="14" height="6" rx="3" fill="#6a4010"/>
</svg>