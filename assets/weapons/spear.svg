<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d0d8e8"/>
      <stop offset="50%" style="stop-color:#9090a8"/>
      <stop offset="100%" style="stop-color:#606878"/>
    </linearGradient>
  </defs>
  <!-- Shaft -->
  <line x1="50" y1="30" x2="50" y2="98" stroke="#8b5e2a" stroke-width="6" stroke-linecap="round"/>
  <line x1="50" y1="30" x2="50" y2="98" stroke="#c08040" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <!-- Spear tip body -->
  <polygon points="50,3 58,32 50,36 42,32" fill="url(#tip)" stroke="#708090" stroke-width="1"/>
  <!-- Tip ridge -->
  <line x1="50" y1="5" x2="50" y2="34" stroke="#d8e0f0" stroke-width="1.5" opacity="0.6"/>
  <!-- Tip shine -->
  <polygon points="50,5 53,18 50,22 47,18" fill="white" opacity="0.25"/>
  <!-- Socket -->
  <rect x="43" y="30" width="14" height="10" rx="2" fill="#506070" stroke="#405060" stroke-width="1"/>
  <!-- Shaft bands -->
  <rect x="44" y="60" width="12" height="4" rx="2" fill="#6a4010" stroke="#4a2800" stroke-width="0.5"/>
  <rect x="44" y="78" width="12" height="4" rx="2" fill="#6a4010" stroke="#4a2800" stroke-width="0.5"/>
  <!-- Butt spike -->
  <polygon points="50,98 53,90 47,90" fill="#707880" stroke="#506070" stroke-width="1"/>
</svg>