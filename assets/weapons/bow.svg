<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7a4a20"/>
      <stop offset="50%" style="stop-color:#b06030"/>
      <stop offset="100%" style="stop-color:#7a4a20"/>
    </linearGradient>
  </defs>
  <!-- Bow limbs -->
  <path d="M30,5 Q5,30 5,50 Q5,70 30,95" fill="none" stroke="url(#bow)" stroke-width="7" stroke-linecap="round"/>
  <!-- Bow highlight -->
  <path d="M30,5 Q8,30 8,50 Q8,70 30,95" fill="none" stroke="#d08040" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <!-- String -->
  <line x1="30" y1="5" x2="30" y2="95" stroke="#e8e8f0" stroke-width="1.5"/>
  <!-- Arrow shaft -->
  <line x1="28" y1="50" x2="90" y2="50" stroke="#c09050" stroke-width="3" stroke-linecap="round"/>
  <!-- Arrow tip -->
  <polygon points="90,50 78,44 78,56" fill="#9090a8" stroke="#707080" stroke-width="1"/>
  <!-- Arrow nock -->
  <polygon points="28,50 35,46 35,54" fill="#4a2800"/>
  <!-- Fletching -->
  <path d="M38,50 Q42,43 46,46 Q42,50 38,50" fill="#e04040" opacity="0.9"/>
  <path d="M38,50 Q42,57 46,54 Q42,50 38,50" fill="#e04040" opacity="0.7"/>
  <!-- Bow grip wrap -->
  <rect x="24" y="42" width="10" height="16" rx="2" fill="#5a3010" opacity="0.6"/>
  <line x1="26" y1="46" x2="32" y2="46" stroke="#3a1800" stroke-width="1.5" opacity="0.6"/>
  <line x1="26" y1="50" x2="32" y2="50" stroke="#3a1800" stroke-width="1.5" opacity="0.6"/>
  <line x1="26" y1="54" x2="32" y2="54" stroke="#3a1800" stroke-width="1.5" opacity="0.6"/>
  <!-- Tip nocks -->
  <rect x="26" y="3" width="8" height="5" rx="2" fill="#6a4010"/>
  <rect x="26" y="92" width="8" height="5" rx="2" fill="#6a4010"/>
</svg>