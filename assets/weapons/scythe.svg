<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d060"/>
      <stop offset="50%" style="stop-color:#c0a020"/>
      <stop offset="100%" style="stop-color:#806800"/>
    </linearGradient>
  </defs>
  <!-- Staff -->
  <line x1="72" y1="5" x2="28" y2="95" stroke="#6b3a1f" stroke-width="7" stroke-linecap="round"/>
  <line x1="72" y1="5" x2="28" y2="95" stroke="#a06030" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <!-- Blade outer arc -->
  <path d="M72,8 Q20,-5 8,38 Q4,56 22,58" fill="none" stroke="url(#blade)" stroke-width="7" stroke-linecap="round"/>
  <!-- Blade inner (sharp edge) -->
  <path d="M72,8 Q20,-5 8,38 Q4,56 22,58" fill="none" stroke="#f0e080" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Blade shine -->
  <path d="M65,10 Q22,2 12,36" fill="none" stroke="white" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
  <!-- Tip -->
  <circle cx="22" cy="58" r="3.5" fill="#e8d060"/>
  <!-- Staff binding -->
  <rect x="60" y="20" width="18" height="4" rx="2" fill="#4a2800" transform="rotate(-55,69,22)"/>
  <rect x="50" y="38" width="18" height="4" rx="2" fill="#4a2800" transform="rotate(-55,59,40)"/>
</svg>