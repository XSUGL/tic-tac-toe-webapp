<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <defs>
    <radialGradient id="body" cx="45%" cy="40%" r="55%">
      <stop offset="0%" style="stop-color:#c4922a"/>
      <stop offset="60%" style="stop-color:#a0721a"/>
      <stop offset="100%" style="stop-color:#7a5010"/>
    </radialGradient>
    <radialGradient id="belly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d4a840"/>
      <stop offset="100%" style="stop-color:#b08828"/>
    </radialGradient>
    <radialGradient id="head" cx="55%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#c49030"/>
      <stop offset="100%" style="stop-color:#8a6018"/>
    </radialGradient>
  </defs>

  <!-- BODY -->
  <ellipse cx="52" cy="50" rx="38" ry="24" fill="url(#body)"/>
  <!-- Belly lighter patch -->
  <ellipse cx="52" cy="56" rx="24" ry="14" fill="url(#belly)" opacity="0.7"/>

  <!-- LEGS (4 stubby legs) -->
  <!-- Back right -->
  <ellipse cx="24" cy="70" rx="7" ry="9" fill="#8a6018" transform="rotate(-8,24,70)"/>
  <ellipse cx="20" cy="77" rx="6" ry="3.5" fill="#6a4408"/>
  <!-- Back left -->
  <ellipse cx="38" cy="70" rx="7" ry="9" fill="#9a7020" transform="rotate(5,38,70)"/>
  <ellipse cx="34" cy="77" rx="6" ry="3.5" fill="#6a4408"/>
  <!-- Front right -->
  <ellipse cx="64" cy="69" rx="6.5" ry="9" fill="#8a6018" transform="rotate(-5,64,69)"/>
  <ellipse cx="60" cy="76" rx="5.5" ry="3.5" fill="#6a4408"/>
  <!-- Front left -->
  <ellipse cx="78" cy="68" rx="6.5" ry="8.5" fill="#9a7020" transform="rotate(8,78,68)"/>
  <ellipse cx="74" cy="75" rx="5.5" ry="3.5" fill="#6a4408"/>

  <!-- Toes/nails on feet -->
  <path d="M17,78 Q18,80 20,79 Q22,80 24,78" fill="none" stroke="#4a3008" stroke-width="1.2"/>
  <path d="M31,78 Q32,80 34,79 Q36,80 38,78" fill="none" stroke="#4a3008" stroke-width="1.2"/>
  <path d="M57,77 Q58,79 60,78 Q62,79 64,77" fill="none" stroke="#4a3008" stroke-width="1.2"/>
  <path d="M71,76 Q72,78 74,77 Q76,78 78,76" fill="none" stroke="#4a3008" stroke-width="1.2"/>

  <!-- HEAD (square/rectangular — capybara's key feature) -->
  <!-- Head base (blocky shape) -->
  <rect x="74" y="22" width="40" height="34" rx="8" fill="url(#head)"/>
  <!-- Head top flatter -->
  <rect x="76" y="20" width="36" height="16" rx="6" fill="#c49030"/>
  <!-- Cheek puff -->
  <ellipse cx="116" cy="40" rx="6" ry="8" fill="#b08025" opacity="0.6"/>

  <!-- SNOUT - very blocky/square -->
  <rect x="100" y="34" width="24" height="18" rx="5" fill="#9a7018"/>
  <!-- Snout top slightly lighter -->
  <rect x="102" y="34" width="20" height="8" rx="4" fill="#b08828" opacity="0.6"/>

  <!-- Nostrils -->
  <ellipse cx="110" cy="42" rx="2.5" ry="1.8" fill="#4a2808"/>
  <ellipse cx="118" cy="42" rx="2.5" ry="1.8" fill="#4a2808"/>
  <!-- Nostril shine -->
  <circle cx="111" cy="41" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="119" cy="41" r="0.8" fill="white" opacity="0.5"/>

  <!-- Mouth line -->
  <path d="M104,50 Q114,54 124,50" fill="none" stroke="#6a4008" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Eye -->
  <circle cx="86" cy="28" r="5.5" fill="#1a0e04"/>
  <circle cx="86" cy="28" r="4" fill="#2a1808"/>
  <circle cx="84" cy="26" r="2" fill="white" opacity="0.7"/>
  <circle cx="88" cy="30" r="1" fill="white" opacity="0.3"/>
  <!-- Eye ring -->
  <circle cx="86" cy="28" r="5.5" fill="none" stroke="#c49030" stroke-width="1"/>

  <!-- Ear (small, round) -->
  <ellipse cx="82" cy="18" rx="7" ry="6" fill="#9a7020" stroke="#7a5010" stroke-width="1"/>
  <ellipse cx="82" cy="19" rx="4" ry="3.5" fill="#c4822a" opacity="0.7"/>

  <!-- Body fur texture hints -->
  <path d="M20,40 Q30,36 40,40" fill="none" stroke="#7a5010" stroke-width="1" opacity="0.3"/>
  <path d="M35,34 Q50,30 60,35" fill="none" stroke="#7a5010" stroke-width="1" opacity="0.3"/>
  <path d="M55,32 Q65,29 72,33" fill="none" stroke="#7a5010" stroke-width="1" opacity="0.25"/>

  <!-- Tail (tiny nub) -->
  <ellipse cx="14" cy="50" rx="5" ry="4" fill="#8a6018"/>

  <!-- Back highlight (top of body) -->
  <ellipse cx="50" cy="34" rx="25" ry="8" fill="white" opacity="0.08"/>
</svg>