<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a830"/>
      <stop offset="50%" style="stop-color:#b08020"/>
      <stop offset="100%" style="stop-color:#7a5808"/>
    </linearGradient>
  </defs>
  <!-- Boomerang body — curved V shape with thick aerofoil cross-section -->
  <!-- Left arm -->
  <path d="M50,50 Q30,35 10,42 Q6,44 8,50 Q10,56 16,54 Q32,48 50,50 Z" fill="url(#bm)" stroke="#8a6010" stroke-width="1.5"/>
  <!-- Right arm going upward -->
  <path d="M50,50 Q60,25 72,10 Q76,5 80,8 Q85,12 82,18 Q72,30 50,50 Z" fill="url(#bm)" stroke="#8a6010" stroke-width="1.5"/>
  <!-- Wood grain on left arm -->
  <path d="M16,50 Q28,44 44,48" fill="none" stroke="#c09020" stroke-width="1" opacity="0.5"/>
  <path d="M20,53 Q30,47 44,50" fill="none" stroke="#c09020" stroke-width="1" opacity="0.4"/>
  <!-- Wood grain on right arm -->
  <path d="M56,42 Q64,28 74,14" fill="none" stroke="#c09020" stroke-width="1" opacity="0.5"/>
  <path d="M58,46 Q68,34 78,20" fill="none" stroke="#c09020" stroke-width="1" opacity="0.4"/>
  <!-- Leading edge highlight (aerofoil) -->
  <path d="M10,44 Q30,36 50,50" fill="none" stroke="#e8c040" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M50,50 Q62,26 80,10" fill="none" stroke="#e8c040" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Tips -->
  <circle cx="10" cy="46" r="3.5" fill="#e8c040" stroke="#a08010" stroke-width="1"/>
  <circle cx="80" cy="10" r="3.5" fill="#e8c040" stroke="#a08010" stroke-width="1"/>
  <!-- Grip wrap at elbow -->
  <circle cx="50" cy="50" r="7" fill="#6a4010" stroke="#8a6010" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="4" fill="#8a5818"/>
  <!-- Decorative stripes -->
  <path d="M22,50 Q26,46 30,48" fill="none" stroke="#1c0c00" stroke-width="1.5" opacity="0.4"/>
  <path d="M60,36 Q64,30 68,28" fill="none" stroke="#1c0c00" stroke-width="1.5" opacity="0.4"/>
</svg>